[project]
name = "calendar-agent"
version = "0.1.0"
description = "Agent that writes events and reminders into iCloud (Apple Calendar + Reminders)"
authors = [
    { name = "dufangshi", email = "dufangshi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "caldav>=3.6.0",
    "icalendar>=7.3.0",
    "pyicloud>=2026.10.1",
]

[project.scripts]
calendar-agent = "calendar_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
